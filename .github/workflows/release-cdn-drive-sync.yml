name: Release CDN Drive Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect manifest-only push
        id: changes
        shell: bash
        run: |
          echo "manifest_only=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$FILE_COUNT" = "1" ] && printf '%s\n' "$CHANGED_FILES" | grep -qx 'wordpress-plugin/cdn-drive-sync/cdn-drive-sync-update.json'; then
              echo "manifest_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Read plugin version
        if: steps.changes.outputs.manifest_only != 'true'
        id: version
        run: |
          VERSION=$(php -r '$content = file_get_contents("wordpress-plugin/cdn-drive-sync/cdn-drive-sync.php"); if (preg_match("/^\\s*\\*\\s*Version:\\s*(.+)$/m", $content, $matches)) { echo trim($matches[1]); }')
          if [ -z "$VERSION" ]; then
            echo "Unable to read plugin version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare package
        if: steps.changes.outputs.manifest_only != 'true'
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/staging/cdn-drive-sync
          cp wordpress-plugin/cdn-drive-sync/cdn-drive-sync.php dist/staging/cdn-drive-sync/
          cat > wordpress-plugin/cdn-drive-sync/cdn-drive-sync-update.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "package": "https://github.com/tomosan078/rental-serv-bunny-cdndrive/releases/latest/download/cdn-drive-sync.zip",
            "requires": "6.0",
            "tested": "6.0",
            "homepage": "https://github.com/tomosan078/rental-serv-bunny-cdndrive",
            "description": "レンタルサーバーとBunnyCDNを連携させる、CDN 配信プラグインです。",
            "changelog": "ホームページよりGitHub Release を確認してください。"
          }
          EOF
          (cd dist/staging && zip -qr ../cdn-drive-sync.zip cdn-drive-sync)

      - name: Publish release
        if: steps.changes.outputs.manifest_only != 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CDN Drive Sync v${{ steps.version.outputs.version }}
          files: |
            dist/cdn-drive-sync.zip
          generate_release_notes: true
          make_latest: true

      - name: Commit manifest back to main
        if: steps.changes.outputs.manifest_only != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wordpress-plugin/cdn-drive-sync/cdn-drive-sync-update.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "Update CDN Drive Sync manifest [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
